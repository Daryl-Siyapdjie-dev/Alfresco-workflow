# Configuration Docker Compose pour Alfresco Community Edition
# Nécessite au moins 6 Go de RAM alloués à Docker (conseillé: 8 Go+).

services:
  alfresco:
    build:
      context: .
      dockerfile: Dockerfile.alfresco
    mem_limit: 1900m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=solr6
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:9090/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dsiriyf.api.url=${SIRIYF_API_URL:-http://integration-api:8080/api/internal/integration/dossier/upload}
        -Dsiriyf.api.token=${SIRIYF_API_TOKEN:-siryf-dev-token}
        -Dsiriyf.api.statut=CREATION
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 1m
    volumes:
      - alf-repo-data:/usr/local/tomcat/alf_data
    extends:
      file: commons/base.yaml
      service: alfresco

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.2
    mem_limit: 1536m
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy

  share:
    build:
      context: .
      dockerfile: Dockerfile.share
    image: alfresco-workflow-share:latest
    mem_limit: 1g
    environment:
      CSRF_FILTER_ORIGIN: http://localhost:9090
      CSRF_FILTER_REFERER: http://localhost:9090/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      alfresco:
        condition: service_healthy
    extends:
      file: commons/base.yaml
      service: share

  postgres:
    image: postgres:17.9
    mem_limit: 512m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - postgres-db-data:/var/lib/postgresql/data

  solr6:
    image: docker.io/alfresco/alfresco-search-services:2.0.20
    mem_limit: 2g
    environment:
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      SOLR_SOLR_HOST: "solr6"
      SOLR_SOLR_PORT: "8983"
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    ports:
      - "8083:8983"
    volumes:
      - solr-index-data:/opt/alfresco-search-services/data

  activemq:
    image: docker.io/alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
    mem_limit: 1g
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    ports:
      - "8161:8161"
      - "5672:5672"
      - "61616:61616"
      - "61613:61613"
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  content-app:
    build:
      context: .
      dockerfile: Dockerfile.content-app
    mem_limit: 128m
    environment:
      APP_BASE_SHARE_URL: "http://localhost:9090/aca/#/preview/s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: content-app

  control-center:
    image: quay.io/alfresco/alfresco-control-center:10.5.0
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 1s
    extends:
      file: commons/base.yaml
      service: control-center

  # Module d'intégration BCRG (notre API) : reçoit le classeur du workflow après l'approbation du
  # transmetteur (étape ④) et le transmet à SIRYF. Joignable par Alfresco via le réseau interne :
  # http://integration-api:8080/api/internal/integration/dossier/upload
  integration-api:
    build:
      context: .
      dockerfile: Dockerfile.integration-api
    mem_limit: 768m
    environment:
      # Identifiants SIRYF : fournis via un fichier .env à la racine (voir .env.example), jamais versionnés.
      BCRG_USERNAME: ${BCRG_USERNAME:-}
      BCRG_PASSWORD: ${BCRG_PASSWORD:-}
      # Jeton partagé avec Alfresco (en-tête X-Internal-Token) — même valeur que -Dsiriyf.api.token.
      BCRG_INTERNAL_TOKEN: ${SIRIYF_API_TOKEN:-siryf-dev-token}
      # Idempotence + piste d'audit persistées (obligatoire hors tests).
      BCRG_PERSISTANCE_DIR: /data
      # SSL bundle optionnel (CA privée) ; laisser vide sinon.
      BCRG_SSL_BUNDLE: ${BCRG_SSL_BUNDLE:-}
      # La JVM respecte la limite mémoire du conteneur.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    volumes:
      - integration-api-data:/data
    ports:
      - "8081:8080"          # exposition hôte pour diagnostic (actuator, appels manuels) ; facultatif
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 45s

  proxy:
    extends:
      file: commons/base.yaml
      service: proxy

volumes:
  postgres-db-data:
  alf-repo-data:
  solr-index-data:
  integration-api-data:
